# Render Blueprint — creates the web service. It uses an existing Render PostgreSQL database
# (spining_pk): paste that database's *Internal* Database URL as DATABASE_URL when Render asks.
# The web service must be in the same region as the database, or the internal URL won't resolve.
# In Render: New → Blueprint → pick this repository → Apply.
#
# Plans: "free" works for trying it out, but
#   • a free web service sleeps after 15 min without visitors (first visit then takes ~1 min), and
#   • a FREE DATABASE EXPIRES 30 DAYS AFTER CREATION and is deleted 14 days later.
# For a real event with customer data, use paid plans, e.g. web "0.5c-512mb" and database "0.1c-256mb".
services:
  - type: web
    name: pharmkulen-spin
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Internal Database URL of the existing database — kept out of git
        sync: false
      - key: ADMIN_PASSWORD # only on an EMPTY database: creates the PharmKulen company + owner account
        sync: false
      # - key: HOME_COMPANY # uncomment to make / open a company's game (e.g. pharmkulen) instead of the landing page
      #   value: pharmkulen
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: TZ
        value: Asia/Phnom_Penh

